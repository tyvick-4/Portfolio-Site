
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Home hero headshot (the LCP image): fetch it before the app script renders the <img> -->
    <link rel="preload" as="image" href="/images/avatar.webp" type="image/webp" fetchpriority="high" />

    <!-- Primary Meta Tags -->
    <title>Tyler Vickers | Staff Product Manager</title>
    <meta name="title" content="Tyler Vickers - Staff Product Manager" />
    <meta name="description" content="Staff PM for Growth at Discord, previously at Amazon Fire TV and Twitch. Turns complex data into actionable product strategies and brings technical and non-technical teams together to ship features that drive measurable growth." />
    <meta name="author" content="Tyler Vickers" />
    <meta name="keywords" content="Staff Product Manager, Product Manager, Discord, Twitch, Amazon, Fire TV, Product Management, Tech PM, Growth Product Manager, Tyler Vickers" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tyvick.com" />
    <meta property="og:title" content="Tyler Vickers - Staff Product Manager" />
    <meta property="og:description" content="Staff PM for Growth at Discord, previously at Amazon Fire TV and Twitch. Turning complex data into actionable product strategies." />
    <meta property="og:image" content="https://tyvick.com/images/avatar.png" />
    <meta property="og:site_name" content="Tyler Vickers Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Tyler Vickers - Staff Product Manager" />

          "image": "https://tyvick.com/headshot.jpg",
          "description": "Staff Product Manager for Growth at Discord, previously at Amazon Fire TV and Twitch. Turns complex data into actionable product strategies and brings technical and non-technical teams together to ship features that drive measurable growth.",
          "jobTitle": "Staff Product Manager, Growth",
          "email": "tyvick@gmail.com",
          "sameAs": [
            "https://www.linkedin.com/in/tyler-vickers-1128258/"
          ],
          "worksFor": {
            "@type": "Organization",
            "name": "Discord",
            "url": "https://discord.com"
          },
          "alumniOf": [
            {
              "@type": "Organization",
              "name": "Amazon",
              "url": "https://www.amazon.com"

            {
              "@type": "Organization",
              "name": "Twitch",
              "url": "https://www.twitch.tv"
            }
          ],
          "hasOccupation": {
            "@type": "Occupation",
            "name": "Staff Product Manager, Growth",
            "skills": "Product Management, Growth Strategy, Customer Lifecycle, Video Streaming, Creator Economy, Data Analysis, Cross-functional Leadership"

            "Product Management",

            "Video Streaming",
            "Creator Economy",
            "Data Analysis",

          ],
          "mainEntityOfPage": {
            "@type": "WebPage",

          }
        },
        {
          "@type": "WebSite",
          "@id": "https://tyvick.com/#website",
          "url": "https://tyvick.com",
          "name": "Tyler Vickers - Staff Product Manager Portfolio",
          "description": "Staff Product Manager portfolio featuring case studies from Discord, Twitch, and Amazon Fire TV.",
          "publisher": {
            "@id": "https://tyvick.com/#person"

    <!-- Font preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

</html>
